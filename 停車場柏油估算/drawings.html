<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254737">
  <title>停車場原圖｜中壢大江購物中心北側</title>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./drawings.css">
  <script defer src="./drawings.js"></script>
</head>
<body>
  <main class="page-width subpage" id="originals">
    <a class="back-link" href="./index.html"><span aria-hidden="true">←</span> 回面積首頁</a>
    <header class="page-title title-row">
      <div><p class="location">桃園中壢・大江購物中心北側</p><h1>停車場原圖</h1></div>
      <div><a class="action" href="../output/pdf/parking-original-drawings.pdf">列印原圖</a><p class="print-help">開啟後按列印。只印車位可選第 3、4 頁，用 A3 紙、大小 100%。</p></div>
    </header>
    <div class="drawing-reader">
      <div class="choices drawing-choices" role="group" aria-label="選要看的圖">
        <button type="button" class="choice" data-drawing="design" aria-controls="drawing-stage" aria-pressed="true">設計區 39 格</button>
        <button type="button" class="choice" data-drawing="existing" aria-controls="drawing-stage" aria-pressed="false">對面 172 格</button>
        <button type="button" class="choice" data-drawing="layout" aria-controls="drawing-stage" aria-pressed="false">全區圖</button>
      </div>
      <div class="drawing-stage" id="drawing-stage" role="region" tabindex="0" aria-label="停車場原圖，可用方向鍵移動圖面" aria-describedby="view-help">
        <img id="drawing-image" src="./assets/parking-preview.webp" alt="設計停車場的 39 個車位及入口" draggable="false">
        <p class="drawing-status" id="drawing-status" role="status" hidden></p>
      </div>
      <div class="drawing-controls">
        <div class="button-row" role="group" aria-label="圖面大小">
          <button class="view-button" id="zoom-in" type="button"><span aria-hidden="true">＋</span> 放大</button>
          <button class="view-button" id="zoom-out" type="button"><span aria-hidden="true">−</span> 縮小</button>
          <button class="view-button" id="reset-view" type="button" hidden>回到原來大小</button>
        </div>
        <p id="view-help">放大後可用手指或滑鼠拖動圖面。</p>
      </div>
    </div>
    <details class="fold">
      <summary>下載原始工程圖檔</summary>
      <div class="fold-body drawing-source">
        <label class="color-option"><input id="original-colors" type="checkbox"> 使用原檔線條顏色</label>
        <div class="button-row">
          <a class="action" href="../L01-05全區平面配置圖-2000.dwg" download="L01-05全區平面配置圖-2000.dwg">下載全區配置圖（DWG）</a>
          <a class="action" href="../LA-baseplan.dwg" download="LA-baseplan.dwg">下載景觀底圖（DWG）</a>
        </div>
        <p>兩處車位圖取自景觀底圖。全區配置圖標出用地範圍，其中 39 格的車位線在原檔設定為隱藏。部分外部測量圖、圖框和列印樣式未隨檔提供。</p>
      </div>
    </details>
  </main>
</body>
</html>
