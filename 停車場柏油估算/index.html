<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254737">
  <meta name="description" content="查看大江購物中心北側停車場的柏油鋪設面積、原圖與用料估算。">
  <title>停車場柏油面積估算｜中壢大江購物中心北側</title>
  <link rel="stylesheet" href="./site.css">
  <script>
    // Keep links shared from the original one-page worksheet usable.
    const previousSection = window.location.hash;
    let destination;
    if (previousSection === '#originals') destination = 'drawings.html';
    if (['#scope', '#material', '#cost', '#evidence'].includes(previousSection)) destination = 'estimate.html';
    if (destination) window.location.replace('./' + destination + window.location.search + previousSection);
  </script>
</head>
<body class="home-page">
  <a class="skip-link" href="#main">跳到面積</a>
  <main id="main" class="page-width">
    <header class="page-title">
      <p class="location">桃園中壢・大江購物中心北側</p>
      <h1>停車場柏油面積估算</h1>
    </header>
    <div class="home-layout">
      <section class="areas" aria-label="依原圖估算的鋪設面積">
        <div class="area">
          <h2>只鋪設計停車場</h2>
          <p class="area-value"><strong>1,008.92</strong> <span>平方公尺</span></p>
          <p class="area-note">含 39 個車位、場內車道和入口。</p>
        </div>
        <div class="area">
          <h2>兩個停車場一起鋪</h2>
          <p class="area-value"><strong>4,280.53</strong> <span>平方公尺</span></p>
          <p class="area-note">再加上對面 172 個車位和車位間的通道。對面的外圈、兩端和入口還要現場量。</p>
        </div>
      </section>
      <nav class="home-actions" aria-label="看圖、列印或試算">
        <a class="action primary" href="./drawings.html">看停車場原圖</a>
        <a class="action" href="../output/pdf/parking-original-drawings.pdf" aria-describedby="home-print-tip">列印原圖</a>
        <a class="action text-action" href="./estimate.html">算用料和費用 <span aria-hidden="true">→</span></a>
        <p class="print-tip" id="home-print-tip">只印車位詳圖，可在圖檔裡選第 3、4 頁，紙張選 A3、大小選 100%。</p>
      </nav>
      <figure class="preview">
        <img src="./assets/parking-preview.webp" width="960" height="640" alt="設計停車場原圖，兩排車位之間是車道，右側是入口。">
        <figcaption>設計停車場原圖 · 39 個車位</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
